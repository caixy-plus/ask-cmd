[package]
name = "ask-cmd"
version = "0.2.0"
edition = "2021"
description = "Natural language to shell command via Claude Code CLI"
license = "MIT"
repository = "https://github.com/caixy-plus/ask-cmd"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
crossterm = "0.28"
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ask"
path = "src/main.rs"

[lib]
name = "ask_cmd"
path = "src/lib.rs"
